<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181818">
<title>Kraftaddition · Zusatztraining | Physik 8</title>
<style>
:root{font-family:system-ui,sans-serif;color:#232321;background:#222;--orange:#ffa653}
*{box-sizing:border-box}body{margin:0}main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.toolbar{background:#fffaf3;border-bottom:1px solid #72675b;padding:.5rem clamp(.65rem,2vw,1.25rem);z-index:1}
.topline,.task-heading,.task-actions,.tools,.levels{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .65rem}
.topline{justify-content:space-between}.topline a{color:#67340c;font-size:.85rem}h1,h2,p{margin:0}h1{font-size:clamp(1rem,2.5vw,1.45rem)}
h2{font-size:1rem}.task-heading,.task-actions{margin-top:.4rem}#progress{font-size:.8rem;color:#784314;font-weight:700}
#prompt{font-size:.94rem;line-height:1.35;margin:.15rem 0}#forces{display:flex;flex-wrap:wrap;gap:.2rem .9rem;list-style:none;padding:0;margin:.2rem 0;font-size:.85rem;color:#51483e}
.small,#hint{font-size:.83rem;line-height:1.35;color:#554b40}.small{margin:.25rem 0}.actions{display:flex;gap:.4rem}#feedback:not(:empty){margin-top:.3rem;font-size:.88rem}#feedback.good{color:#22613c}#feedback.bad{color:#862b1b}
button{font:inherit;font-size:.86rem;font-weight:700;border:1px solid #c9c1b4;background:#fff;color:#222;border-radius:.45rem;padding:.35rem .6rem;min-height:36px;cursor:pointer}button[aria-pressed=true],.primary{background:var(--orange);border-color:#ba6624}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #864300;outline-offset:2px}
summary{font-size:.86rem;font-weight:700;cursor:pointer}details[open]{flex-basis:100%}#hint{margin-top:.2rem}[hidden]{display:none!important}
.surface{position:relative;flex:1;min-height:260px;background:#222}
#diagram{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;user-select:none}
.axis{stroke:#aaa092;stroke-width:.7}.arrow{stroke-width:3;stroke-linecap:round}.diagram-label{font:700 13px system-ui;paint-order:stroke;stroke:#222;stroke-width:4px;stroke-linejoin:round}
.handle{cursor:grab;outline:none}.handle:active{cursor:grabbing}.handle:focus-visible .visible-handle{stroke:#fff;stroke-width:2.5}.construction{stroke-dasharray:5 3}
.tip-value{font:700 13px system-ui;paint-order:stroke;stroke:#222;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
@media(pointer:coarse){button{min-height:44px}}
</style>
</head>
<body>
<main>
<div class="toolbar">
<div class="topline"><h1>Kraftaddition · Zusatztraining</h1><nav class="levels" aria-label="Übungen auswählen">
<button data-level="0" aria-pressed="true" aria-label="Ein Stern, Kräfte auf einer Linie">★☆☆</button>
<button data-level="1" aria-pressed="false" aria-label="Zwei Sterne, Kräfte im Winkel">★★☆</button>
<button data-level="2" aria-pressed="false" aria-label="Drei Sterne, fehlende Kraft bestimmen">★★★</button>
<button data-level="3" aria-pressed="false">Exit-Ticket</button>
</nav><a href="../">Zur Übersicht</a></div>
<div class="task-heading"><h2 id="task-title"></h2><p id="progress"></p></div>
<p id="prompt"></p><ul id="forces"></ul>
<p class="small" id="drawing-guide">Ziehe die orange Pfeilspitze mit dem Finger oder der Maus. Raster: fein 2,5 N · kräftig 10 N. 0° zeigt nach rechts, 90° nach oben.</p>
<div class="task-actions">
<div id="drawing-tools" class="tools"><span class="small">Hilfspfeile am gelben Anfang ziehen:</span><div class="tools" id="copy-buttons"></div></div>
<div class="actions"><button class="primary" id="check">Prüfen</button><button id="next" hidden>Weiter</button></div>
<details id="help"><summary>Tipp anzeigen</summary><p id="hint"></p></details>
</div>
<p id="feedback" role="status" aria-live="polite"></p>
</div>
<section class="surface" aria-label="Kraftdiagramm">
<svg id="diagram" viewBox="0 0 440 310" role="group" aria-label="Koordinatensystem mit gemeinsamem Angriffspunkt">
<defs><marker id="fixedTip" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#d7dde4"/></marker><marker id="answerTip" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#ffa653"/></marker><marker id="helperTip" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#f4d47f"/></marker><pattern id="minorGrid" patternUnits="userSpaceOnUse" x="220" y="155" width="3.375" height="3.375"><path d="M0 3.375V0H3.375" fill="none" stroke="#494640" stroke-width=".36"/></pattern>
<pattern id="majorGrid" patternUnits="userSpaceOnUse" x="220" y="155" width="13.5" height="13.5"><path d="M0 13.5V0H13.5" fill="none" stroke="#686258" stroke-width=".65"/></pattern></defs>
<rect id="minor-fill" fill="url(#minorGrid)"/><rect id="major-fill" fill="url(#majorGrid)"/>
<g id="grid"></g><g id="vectors"></g><g id="handles"></g>
</svg>
</section>
</main>
<script>
'use strict';
const tasks = [
 [
  {name:'Rettungsschlitten', prompt:'Drei Personen ziehen am selben Schlitten. Stelle den Pfeil der Gesamtkraft ein.', vectors:[[45,0],[35,0],[55,180]], hint:'Addiere zuerst die Kräfte, die nach rechts wirken. Ziehe dann die nach links wirkende Kraft ab.'},
  {name:'Seilwinde am Hang', prompt:'Eine Winde zieht die Last am Hang hinauf. Zwei Kräfte ziehen entlang des Hangs hinab. Stelle die Gesamtkraft ein.', vectors:[[70,30],[45,210],[25,210]], hint:'30° und 210° sind entgegengesetzte Richtungen. Bei 0 N spielt die Richtung keine Rolle.'}
 ],
 [
  {name:'Zwei Schlepper', prompt:'Die Schlepper ziehen das Schiff unter einem Winkel von 60°. Stelle die Gesamtkraft ein.', vectors:[[40,0],[40,60]], hint:'Bei zwei gleich großen Kräften liegt die Gesamtkraft genau zwischen den Pfeilen. Verschiebe Kopien der Kräfte parallel an die jeweils andere Spitze, um ein Kräfteparallelogramm zu zeichnen.'},
  {name:'Suchroboter', prompt:'Zwei gespannte Seile ziehen den Roboter in unterschiedliche Richtungen. Stelle die Gesamtkraft ein.', vectors:[[40,0],[30,90]], hint:'Lege die Hilfspfeile an die jeweils andere Pfeilspitze. Die Diagonale des Rechtecks zeigt die Gesamtkraft.'}
 ],
 [
  {name:'Boje auf Position halten', prompt:'Zwei Seile ziehen an der Boje. Stelle die dritte Kraft so ein, dass die Gesamtkraft der drei Seile 0 N beträgt.', vectors:[[30,0],[40,90]], mode:'balance', hint:'Bestimme zuerst die Gesamtkraft der beiden sichtbaren Pfeile. Die dritte Kraft muss ihr genau entgegenwirken.'},
  {name:'Bergung eines Boots', prompt:'Ein Schlepper zieht das Boot mit F₁. Beide Schlepper zusammen sollen das Boot mit 60 N nach rechts ziehen. Stelle die fehlende Kraft F₂ ein.', vectors:[[50,53]], mode:'target', target:[60,0], hint:'Verbinde die Spitze von F₁ mit der Spitze der gestrichelten Zielkraft. Übertrage die Strecke parallel an den Angriffspunkt.'}
 ],
 [
  {name:'Kräfte auf einer Linie', prompt:'Stelle die Gesamtkraft ein.', vectors:[[65,180],[25,0],[15,0]]},
  {name:'Kräfte im Winkel', prompt:'Stelle die Gesamtkraft ein.', vectors:[[40,0],[30,270]]},
  {name:'Kräftegleichgewicht', prompt:'Stelle eine dritte Kraft ein, sodass die Gesamtkraft 0 N beträgt.', vectors:[[30,90],[40,180]], mode:'balance'}
 ]
];
const byId = id => document.getElementById(id);
const feedback = byId('feedback'), diagram = byId('diagram');
const rad = degrees => degrees * Math.PI / 180;
const xy = ([force, direction]) => [force * Math.cos(rad(direction)), force * Math.sin(rad(direction))];
const normalize = degrees => (degrees + 360) % 360;
function solution(task) {
  const [x,y] = task.vectors.map(xy).reduce(([a,b],[c,d]) => [a+c,b+d], [0,0]);
  if (task.mode === 'balance') return [-x,-y];
  if (task.mode === 'target') {
    const [a,b] = xy(task.target);
    return [a-x,b-y];
  }
  return [x,y];
}
const origin = [220,155], scale = 1.35;
function element(parent, tag, attributes, label) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key,value] of Object.entries(attributes)) node.setAttribute(key,value);
  if (label) node.textContent = label;
  parent.append(node);
  return node;
}
const grid = byId('grid');
let bounds = [0,0,440,310];
function fitDiagram() {
  const {width,height}=diagram.getBoundingClientRect();
  if(!width||!height)return;
  const ratio=Math.min(width/440,height/310);
  const w=width/ratio,h=height/ratio;
  bounds=[origin[0]-w/2,origin[1]-h/2,w,h];
  diagram.setAttribute('viewBox',bounds.join(' '));
  const [left,top]=bounds,right=left+w,bottom=top+h;
  for(const id of ['minor-fill','major-fill']){
    const fill=byId(id);
    for(const [name,value] of Object.entries({x:left,y:top,width:w,height:h})) fill.setAttribute(name,value);
  }
  grid.replaceChildren();
  element(grid,'line',{x1:left,x2:right,y1:origin[1],y2:origin[1],class:'axis'});
  element(grid,'line',{x1:origin[0],x2:origin[0],y1:top,y2:bottom,class:'axis'});
  for(const [x,y,label] of [[right-25,origin[1]-7,'0°'],[origin[0]+8,top+17,'90°'],[left+8,origin[1]-7,'180°'],[origin[0]+8,bottom-8,'270°']]){
    element(grid,'text',{x,y,fill:'#eee',class:'diagram-label'},label);
  }
}
let level=0, index=0, score=0, checked=false, completed=false;
let task = tasks[0][0];
const step = 10 * scale;
const snapStep = step / 4;
const newtons = new Intl.NumberFormat("de", {maximumFractionDigits:1});
let guess = [origin[0] + step, origin[1]];
let copies = new Map();
let drag = null;

function endpoint(start, vector) {
  const [x,y] = xy(vector);
  return [start[0] + x*scale, start[1] - y*scale];
}
function distance(a,b) {
  return Math.hypot(a[0]-b[0],a[1]-b[1]);
}
function vectorLayout() {
  return task.vectors.map((v,i) => {
    const matching = task.vectors.map((w,j) => w[1] === v[1] ? j : -1).filter(j => j >= 0);
    const offset = (matching.indexOf(i) - (matching.length-1)/2)*13;
    const start = [origin[0]+Math.sin(rad(v[1]))*offset, origin[1]+Math.cos(rad(v[1]))*offset];
    return {start,end:endpoint(start,v)};
  });
}
function paint() {
  const group = byId('vectors'), handles = byId('handles');
  group.replaceChildren();
  for(const handle of Array.from(handles.children)){
    if(handle.dataset.key !== 'answer' && !copies.has(Number(handle.dataset.key))) handle.remove();
  }
  const color = {fixed:'#d7dde4',answer:'#ffa653',helper:'#f4d47f'};
  function draw(start,end,style,label='',dashed=false,labelDy=-7) {
    if(distance(start,end)>.3) element(group,'line',{x1:start[0],y1:start[1],x2:end[0],y2:end[1],stroke:color[style],class:'arrow'+(dashed?' construction':''),'marker-end':'url(#'+style+'Tip)'});
    if(label) element(group,'text',{x:end[0]+(end[0]<start[0]?-7:7),y:end[1]+labelDy,fill:color[style],class:'diagram-label','text-anchor':end[0]<start[0]?'end':'start'},label);
  }
  function grip(key,position,label,stroke) {
    let handle=Array.from(handles.children).find(node=>node.dataset.key===key);
    if(!handle){
      handle=element(handles,'g',{class:'handle',role:'group',tabindex:'0','aria-label':label});
      handle.dataset.key=key;
      element(handle,'circle',{r:19,fill:'transparent'});
      element(handle,'circle',{r:5.5,fill:'#222',stroke,'stroke-width':2,class:'visible-handle','pointer-events':'none'});
    }
    handle.setAttribute('transform','translate('+position.join(' ')+')');
    handle.setAttribute('tabindex',checked?'-1':'0');
    handle.style.display=checked?'none':'';
  }
  const layout=vectorLayout();
  layout.forEach(({start,end},i)=>{
    if(distance(start,origin)>.3) element(group,'line',{x1:origin[0],y1:origin[1],x2:start[0],y2:start[1],stroke:'#aaa092','stroke-dasharray':'2 2'});
    draw(start,end,'fixed','F'+(i+1));
  });
  if(task.target) draw(origin,endpoint(origin,task.target),'helper','Zielkraft',true,16);
  for(const [i,start] of copies){
    draw(start,endpoint(start,task.vectors[i]),'helper','',true);
    grip(String(i),start,'Hilfspfeil zu F'+(i+1)+'. Mit den Pfeiltasten verschieben.',color.helper);
  }
  draw(origin,guess,'answer');
  element(group,'circle',{cx:origin[0],cy:origin[1],r:2.8,fill:'#fff'});
  grip('answer',guess,'Spitze des Antwortpfeils. Mit den Pfeiltasten verschieben.',color.answer);
  // Keep the answer handle above the construction arrows at intersecting points.
  const answer=Array.from(handles.children).find(node=>node.dataset.key==='answer');
  if(!drag && handles.lastElementChild!==answer) handles.append(answer);
  const n=distance(guess,origin)/scale;
  const [left,top,w]=bounds;
  const useLeft=guess[0]>left+w-105;
  const label=newtons.format(n)+' N';
  element(group,'text',{x:guess[0]+(useLeft?-32:32),y:guess[1]+(guess[1]<top+42?36:-28),fill:color.answer,class:'tip-value','text-anchor':useLeft?'end':'start'},label);
  answer.setAttribute('aria-label','Spitze des Antwortpfeils: '+label+'. Mit den Pfeiltasten verschieben.');
}
function resetDrawing() {
  guess=[origin[0]+step,origin[1]];
  copies.clear();
  drag=null;
  byId('drawing-tools').hidden=false;
  byId('copy-buttons').replaceChildren(...task.vectors.map((v,i)=>{
    const button=document.createElement('button');
    button.textContent='Kopie von F'+(i+1);
    button.setAttribute('aria-pressed','false');
    button.addEventListener('click',()=>{
      if(checked)return;
      if(copies.has(i)) copies.delete(i);
      else copies.set(i,[origin[0],origin[1]+44+i*25]);
      button.setAttribute('aria-pressed',String(copies.has(i)));
      paint();
    });
    return button;
  }));
}
function place(key,point,snap) {
  const [left,top,w,h]=bounds;
  const margins=18;
  const min=[left+margins,top+margins], max=[left+w-margins,top+h-margins];
  point=point.map((v,i)=>Math.max(min[i],Math.min(max[i],v)));
  if(snap){
    const anchors=[origin];
    if(key!=='answer') anchors.push(...vectorLayout().map(({end})=>end));
    for(const [i,start] of copies) if(String(i)!==key) anchors.push(endpoint(start,task.vectors[i]));
    const closest=anchors.reduce((a,b)=>distance(point,b)<distance(point,a)?b:a);
    if(distance(point,closest)<snapStep && closest.every((v,i)=>v>=min[i]&&v<=max[i])) point=[...closest];
    else point=point.map((v,i)=>{
      const first=Math.ceil((min[i]-origin[i])/snapStep);
      const last=Math.floor((max[i]-origin[i])/snapStep);
      const index=Math.max(first,Math.min(last,Math.round((v-origin[i])/snapStep)));
      return origin[i]+index*snapStep;
    });
  }
  if(key==='answer')guess=point;
  else copies.set(Number(key),point);
  paint();
}
const positionOf=key=>key==='answer'?guess:copies.get(Number(key));
function pointerPosition(event) {
  return new DOMPoint(event.clientX,event.clientY).matrixTransform(diagram.getScreenCTM().inverse());
}
diagram.addEventListener('pointerdown',event=>{
  const handle=event.target.closest('.handle');
  if(checked||drag||!handle||event.button!==0)return;
  const key=handle.dataset.key, [x,y]=positionOf(key), point=pointerPosition(event);
  drag={id:event.pointerId,key,dx:x-point.x,dy:y-point.y};
  diagram.setPointerCapture(event.pointerId);
  event.preventDefault();
});
diagram.addEventListener('pointermove',event=>{
  if(drag?.id!==event.pointerId)return;
  const point=pointerPosition(event);
  place(drag.key,[point.x+drag.dx,point.y+drag.dy],true);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) diagram.addEventListener(type,event=>{
  if(drag?.id===event.pointerId)drag=null;
});
diagram.addEventListener('keydown',event=>{
  const key=event.target.closest('.handle')?.dataset.key;
  const directions={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const direction=directions[event.key];
  if(checked||key===undefined||!direction)return;
  event.preventDefault();
  const [x,y]=positionOf(key), increment=event.shiftKey?step:snapStep;
  place(key,[x+direction[0]*increment,y+direction[1]*increment],false);
});
function loadTask() {
  task=tasks[level][index];
  checked=completed=false;
  byId('drawing-guide').hidden=false;
  byId('check').hidden=false;
  byId('next').hidden=true;
  byId('help').open=false;
  byId('help').hidden=level===3;
  byId('hint').textContent=task.hint||'';
  byId('progress').textContent='Aufgabe '+(index+1)+' von '+tasks[level].length;
  byId('task-title').textContent=task.name;
  byId('prompt').textContent=task.prompt;
  byId('forces').replaceChildren(...task.vectors.map(([n,w],i)=>{
    const li=document.createElement('li');
    li.textContent='F'+(i+1)+' = '+n+' N bei '+w+'°';
    return li;
  }));
  resetDrawing();
  feedback.className='';
  feedback.textContent=level===3?'Anonyme Selbstkontrolle. Dein Ergebnis erscheint am Ende.':'';
  paint();
}
function validate() {
  const [x,y]=solution(task);
  const expected=Math.hypot(x,y);
  const direction=normalize(Math.atan2(y,x)*180/Math.PI);
  const [gx,gy]=[(guess[0]-origin[0])/scale,(origin[1]-guess[1])/scale];
  const n=Math.hypot(gx,gy);
  const actualAngle=normalize(Math.atan2(gy,gx)*180/Math.PI);
  const separation=Math.abs(actualAngle-direction);
  const magnitudeOK=Math.abs(n-expected)<=3;
  const angleOK=expected<.001||(n>0&&Math.min(separation,360-separation)<=6);
  const correct=magnitudeOK&&angleOK;
  return {correct,magnitudeOK,angleOK,expected,direction};
}
byId('check').addEventListener('click',()=>{
  if(checked)return;
  const {correct,magnitudeOK,angleOK,expected,direction}=validate();
  if(!correct&&level!==3){
    feedback.className='bad';
    feedback.textContent=magnitudeOK?'Der Betrag passt. Prüfe die Richtung.':angleOK?'Die Richtung passt. Prüfe den Betrag.':'Prüfe Betrag und Richtung noch einmal.';
    return;
  }
  checked=true;
  if(correct)score++;
  byId('drawing-tools').hidden=true;
  paint();
  feedback.className=level===3?'':'good';
  const roundedAngle=normalize(Math.round(direction));
  feedback.textContent=level===3?'Antwort übernommen.':expected<.001?'Richtig. Die Kräfte gleichen sich aus.':'Richtig. Der Pfeil entspricht ungefähr '+Math.round(expected)+' N bei '+roundedAngle+'°.';
  byId('check').hidden=true;
  byId('next').textContent=index+1<tasks[level].length?'Nächste Aufgabe':'Ergebnis ansehen';
  byId('next').hidden=false;
  byId('next').focus();
});
byId('next').addEventListener('click',()=>{
  if(completed){restart();byId('handles').querySelector('[data-key=answer]').focus();return;}
  if(index+1<tasks[level].length){index++;loadTask();byId('handles').querySelector('[data-key=answer]').focus();return;}
  byId('progress').textContent='Abgeschlossen';
  byId('task-title').textContent=level===3?'Dein Exit-Ticket':'Übung abgeschlossen';
  byId('prompt').textContent=score+' von '+tasks[level].length+' Aufgaben richtig.';
  byId('forces').replaceChildren();
  byId('drawing-guide').hidden=byId('help').hidden=true;
  feedback.textContent='';
  byId('next').textContent='Neu starten';
  completed=true;
  byId('next').focus();
});
function restart() {
  index=score=0;
  loadTask();
}
for(const button of document.querySelectorAll('[data-level]')){
  button.addEventListener('click',()=>{
    level=Number(button.dataset.level);
    for(const other of document.querySelectorAll('[data-level]')) other.setAttribute('aria-pressed',String(other===button));
    restart();
  });
}
fitDiagram();
loadTask();
new ResizeObserver(()=>{fitDiagram();paint();}).observe(diagram);
</script>
</body>
</html>
